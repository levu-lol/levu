  <path fill="#00E58C"
        d="M122 6 L122 314 L214 178 C234 150 234 138 214 112 Z
           M122 6 C128 92 148 140 196 159 C148 178 128 226 122 314 Z" fill-rule="evenodd"/>
</svg>
